<mat-nav-list>
  <a
    mat-list-item
    routerLink="/signup"
    (click)="onCloseSidenav()"
    *ngIf="!(isAuth$ | async)"
  >
    <div class="nav-item-content">
      <mat-icon fontIcon="person_add"></mat-icon>
      <span class="nav-caption">Signup</span>
    </div>
  </a>
  <a
    mat-list-item
    routerLink="/user-login"
    (click)="onCloseSidenav()"
    *ngIf="!(isAuth$ | async)"
  >
    <div class="nav-item-content">
      <mat-icon fontIcon="account_circle"></mat-icon>
      <span class="nav-caption"> Login </span>
    </div>
  </a>
  <a
    mat-list-item
    routerLink="/training"
    (click)="onCloseSidenav()"
    *ngIf="(isAuth$ | async)"
  >
    <div class="nav-item-content">
      <mat-icon fontIcon="fitness_center"></mat-icon>
      <span class="nav-caption"> Training </span>
    </div>
  </a>
  <mat-list-item (click)="onLogout()" *ngIf="(isAuth$ | async)">
    <button mat-button>
      <div class="nav-item-content">
        <mat-icon fontIcon="eject"></mat-icon>
        <span class="nav-caption">Logout</span>
      </div>
    </button>
  </mat-list-item>
</mat-nav-list>
